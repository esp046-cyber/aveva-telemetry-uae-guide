<g fill="#e9eef3"><text x="20" y="25" font-size="14">2-wire loop: 24 VDC supply, transmitter, RTU AI</text><text x="40" y="105">24 VDC</text><text x="40" y="122">supply</text><text x="245" y="105">Passive</text><text x="245" y="122">transmitter</text><text x="445" y="105">RTU AI</text><text x="445" y="122">(250R shunt)</text>
